[package]
name = "disk-cleaner"
version = "0.10.0"
edition = "2021"

[dependencies]
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
walkdir = "2"
sysinfo = "0.33"
trash = "5"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[build-dependencies]
embed-resource = "=3.0.12"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
